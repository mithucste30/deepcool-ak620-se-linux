name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          VER="${v%-*}"
          REL="${v##*-}"
          if [ "$VER" = "$v" ]; then REL=1; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: Build .deb
        run: ./build-deb.sh

      - name: Build .rpm
        run: ./build-rpm.sh

      - name: Show artifacts
        run: ls -la dist/

      - name: Create GitHub release with packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.deb dist/*.rpm
